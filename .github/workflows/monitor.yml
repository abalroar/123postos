name: LATAM Flight Monitor

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT (UTC-3)
    - cron: '0 23 * * *'   # 20:00 BRT
  workflow_dispatch:
    inputs:
      origin:
        description: 'Origem IATA (ex: CGH, GRU)'
        required: false
        default: ''
      dest:
        description: 'Destino IATA (ex: BSB, GIG)'
        required: false
        default: ''
      months:
        description: 'Meses a frente: 1, 2, 3, 6 ou 12'
        required: false
        default: '3'
      weekday:
        description: 'Dia: 1=Segunda 2=Terca 3=Quarta 4=Quinta 5=Sexta 6=Sabado 7=Domingo 0=Qualquer'
        required: false
        default: '0'
      time_period:
        description: 'Horario: madrugada / manha / tarde / noite / qualquer'
        required: false
        default: 'qualquer'
      chat_id:
        description: 'Telegram chat_id do solicitante (para enviar resultado de volta)'
        required: false
        default: ''

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Busca agendada (08h e 20h BRT) ou dispatch sem parametros
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.origin == '') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          DATA_SOURCE: google
        run: python main.py

      - name: Busca customizada (dispatch com origem e destino)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.origin != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id != '' && inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          SEARCH_ORIGIN: ${{ inputs.origin }}
          SEARCH_DEST: ${{ inputs.dest }}
          SEARCH_MONTHS: ${{ inputs.months }}
          SEARCH_WEEKDAY: ${{ inputs.weekday }}
          SEARCH_TIME_PERIOD: ${{ inputs.time_period }}
        run: python run_search.py
