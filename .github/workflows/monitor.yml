name: LATAM Flight Monitor

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT (UTC-3, Brasil não tem horário de verão desde 2019)
    - cron: '0 23 * * *'   # 20:00 BRT
  workflow_dispatch:
    inputs:
      origin:
        description: 'Origem IATA (ex: CGH, GRU)'
        required: false
        default: ''
      dest:
        description: 'Destino IATA (ex: BSB, GIG)'
        required: false
        default: ''
      months:
        description: 'Meses à frente (1/2/3/6/12)'
        required: false
        default: '3'
      weekday:
        description: 'Dia da semana: 0=Seg 1=Ter 2=Qua 3=Qui 4=Sex 5=Sáb 6=Dom -1=Qualquer'
        required: false
        default: '-1'
      time_period:
        description: 'Período: manha / tarde / noite / qualquer'
        required: false
        default: 'qualquer'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (agendado ou manual sem parâmetros)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.origin == '') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
        run: python main.py

      - name: Busca customizada (manual com parâmetros)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.origin != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          SEARCH_ORIGIN: ${{ inputs.origin }}
          SEARCH_DEST: ${{ inputs.dest }}
          SEARCH_MONTHS: ${{ inputs.months }}
          SEARCH_WEEKDAY: ${{ inputs.weekday }}
          SEARCH_TIME_PERIOD: ${{ inputs.time_period }}
        run: python run_search.py
