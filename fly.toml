# Fly.io — LATAM Monitor Bot
# Deploy: flyctl deploy
# Secrets: flyctl secrets set TELEGRAM_BOT_TOKEN=... TELEGRAM_CHAT_ID=... etc.

app = "latam-monitor-bot"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile"

# Bot usa long-polling (não expõe HTTP) — sem [http_service] para evitar
# health checks que reiniciariam o container por falta de porta aberta.
[processes]
  app = "python bot.py"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
