# Data source: "scraper" (Playwright, default), "amadeus", or "auto" (scraper + fallback)
data_source: google

# Which months to search for flights.
# start_months_ahead: começar a buscar daqui a N meses (3 = daqui a 3 meses)
# end_months_ahead:   buscar até N meses à frente
# Regra: como você sempre tem passagens para os próximos 2 meses,
#        start=3 garante que só busca meses que você ainda não tem.
# Exemplo: hoje = março → start=3 significa junho, end=5 significa agosto (jun + jul + ago)
date_range:
  start_months_ahead: 3
  end_months_ahead: 5

# Fetch LATAM Pass points prices in addition to R$ (requires extra page load per search)
fetch_points: false  # Google Flights não exibe pontos LATAM Pass

# Scraper settings
scraper:
  headless: false  # true bloqueia no LATAM (detecta automação), false funciona
  timeout_ms: 45000
  delay_between_searches: 3.0  # seconds between page loads (anti-bot)

monitoring:
  weekday_routes:
    - origin: CGH
      destination: BSB
      days_of_week: [2, 4]  # 0=Mon, 2=Wed, 4=Fri
      min_departure_time: "20:00"
      airline: "LA"
      fare_family: "FULL"
      currency: BRL
      weeks_ahead: 3

  sunday_routes:
    - origin: BSB
      destination: CGH
      days_of_week: [6]  # 6=Sun
      mode: "last_or_cheapest"
      currency: BRL
      weeks_ahead: 3
    - origin: CGH
      destination: BSB
      days_of_week: [6]
      mode: "last_or_cheapest"
      currency: BRL
      weeks_ahead: 3

alerts:
  good_deal_percentile: 50  # p50 = median
  alert_without_history: true

# Your average cost to acquire 1.000 LATAM Pass points (in BRL).
# Used to compare: is it cheaper to pay in R$ or redeem points?
points:
  cost_per_thousand: 24.50

schedule:
  run_times: ["08:00", "20:00"]
  timezone: "America/Sao_Paulo"

data:
  history_csv: "data/history.csv"
  database: "data/prices.db"
